name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run the script
        run: python hello_world.py
      - name: Run the tests
        # pytest exits 5 when it finds no tests; that is not a failure yet.
        run: python -m pytest -q || [ $? -eq 5 ]
